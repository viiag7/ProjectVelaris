name: Story
description: Define a sprint-sized user or platform outcome
title: "[Story] "
labels:
  - enhancement
body:
  - type: textarea
    id: story
    attributes:
      label: Story / outcome
      description: Describe the actor, capability and outcome.
      placeholder: "As a ..., I want ..., so that ..."
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Parent Epic
      placeholder: "#123"
  - type: textarea
    id: requirements
    attributes:
      label: Related RF / RNF / ADR
      placeholder: "RF-CRE-010, RNF-AUZ-001, ADR-0004"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable and testable criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      options:
        - label: Acceptance criteria are testable.
          required: true
        - label: Dependencies are known.
          required: true
        - label: Security/reliability implications were considered.
          required: true
        - label: Major uncertainty is resolved or tracked by a Spike.
          required: true
