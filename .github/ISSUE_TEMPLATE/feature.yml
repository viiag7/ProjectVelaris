name: Feature
description: Track implementation work for an approved requirement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: Reference the functional requirements implemented by this issue.
      placeholder: "RF-CRE-010, RF-MSG-002"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the implementation work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable completion criteria.
    validations:
      required: true
